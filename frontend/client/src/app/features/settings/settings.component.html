<div class="container mx-auto p-4 max-w-xl ">
    <h2 class="text-2xl font-semibold mb-4">Settings</h2>

    <form [formGroup]="form" class="space-y-4">
        <div>
            <label>First name</label>
            <input class="border rounded p-2 w-full" formControlName="firstName" />
        </div>

        <div>
            <label>Last name</label>
            <input class="border rounded p-2 w-full" formControlName="lastName" />
        </div>

        <div>
            <label>Email (locked)</label>
            <input class="border rounded p-2 w-full bg-gray-100" formControlName="email" />
        </div>

        <div>
            <label>Description</label>
            <textarea class="border rounded p-2 w-full" rows="4" formControlName="description"></textarea>
        </div>
    </form>
    
    
    <div class="p-4 border rounded mt-4">
        <div class="flex items-center justify-between">
            <div class="font-semibold">Account</div>
            <button mat-icon-button class="px-3 py-2 border rounded bg-blue-600 text-white hover:bg-blue-700 cursor-pointer" (click)="logout()">
                Logout
            </button>
        </div>
    </div>
    <div class="text-m mt-2">
        <span *ngIf="saving">Saving…</span>
        <span *ngIf="saved">Saved ✅</span>
    </div>
